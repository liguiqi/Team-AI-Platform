services:
  caddy:
    image: caddy:${CADDY_VERSION}
    container_name: ai-gateway-caddy
    restart: always
    depends_on:
      - librechat
      - new-api
      - casdoor
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./proxy/config/Caddyfile:/etc/caddy/Caddyfile:ro
      - ../runtime/prod/caddy/data:/data
      - ../runtime/prod/caddy/config:/config
    networks:
      - gateway

  new-api:
    image: calciumion/new-api:${NEW_API_VERSION}
    container_name: ai-gateway-new-api
    restart: always
    command: --log-dir /app/logs
    depends_on:
      - new-api-postgres
      - new-api-redis
    environment:
      TZ: ${TZ}
      SQL_DSN: postgresql://${NEW_API_DB_USER}:${NEW_API_DB_PASSWORD}@new-api-postgres:5432/${NEW_API_DB_NAME}?sslmode=disable
      REDIS_CONN_STRING: redis://:${NEW_API_REDIS_PASSWORD}@new-api-redis:6379/0
      SESSION_SECRET: ${NEW_API_SESSION_SECRET}
      FRONTEND_BASE_URL: ${NEW_API_PUBLIC_URL}
      ERROR_LOG_ENABLED: "true"
      BATCH_UPDATE_ENABLED: "true"
      GENERATE_DEFAULT_TOKEN: "false"
    volumes:
      - ../runtime/prod/new-api/data:/data
      - ../runtime/prod/new-api/logs:/app/logs
    networks:
      - gateway

  new-api-postgres:
    image: postgres:${POSTGRES_VERSION}
    container_name: ai-gateway-new-api-postgres
    restart: always
    environment:
      POSTGRES_DB: ${NEW_API_DB_NAME}
      POSTGRES_USER: ${NEW_API_DB_USER}
      POSTGRES_PASSWORD: ${NEW_API_DB_PASSWORD}
    volumes:
      - ../runtime/prod/new-api/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NEW_API_DB_USER} -d ${NEW_API_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - gateway

  new-api-redis:
    image: redis:${REDIS_VERSION}
    container_name: ai-gateway-new-api-redis
    restart: always
    command: redis-server --appendonly yes --requirepass ${NEW_API_REDIS_PASSWORD}
    volumes:
      - ../runtime/prod/new-api/redis:/data
    networks:
      - gateway

  casdoor:
    image: casbin/casdoor:${CASDOOR_VERSION}
    container_name: ai-gateway-casdoor
    restart: always
    entrypoint: /bin/sh -c './server --createDatabase=true'
    depends_on:
      new-api-postgres:
        condition: service_healthy
    environment:
      RUNNING_IN_DOCKER: "true"
    volumes:
      - ../runtime/prod/casdoor/app.conf:/conf/app.conf:ro
      - ../runtime/prod/casdoor/init_data.json:/init_data.json:ro
      - ../runtime/prod/casdoor/logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8000/.well-known/openid-configuration >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks:
      - gateway

  librechat:
    image: ghcr.io/danny-avila/librechat:${LIBRECHAT_VERSION}
    container_name: ai-gateway-librechat
    restart: always
    depends_on:
      librechat-mongodb:
        condition: service_started
      new-api:
        condition: service_started
      casdoor:
        condition: service_healthy
    environment:
      HOST: ${LIBRECHAT_HOST}
      PORT: "3080"
      MONGO_URI: mongodb://librechat-mongodb:27017/LibreChat
      CONFIG_PATH: /app/librechat.yaml
      DOMAIN_CLIENT: ${LIBRECHAT_PUBLIC_URL}
      DOMAIN_SERVER: ${LIBRECHAT_PUBLIC_URL}
      SEARCH: ${LIBRECHAT_SEARCH_ENABLED}
      ALLOW_EMAIL_LOGIN: ${LIBRECHAT_ALLOW_EMAIL_LOGIN}
      ALLOW_REGISTRATION: ${LIBRECHAT_ALLOW_REGISTRATION}
      ALLOW_SOCIAL_LOGIN: ${LIBRECHAT_ALLOW_SOCIAL_LOGIN}
      ALLOW_PASSWORD_RESET: ${LIBRECHAT_ALLOW_PASSWORD_RESET}
      ALLOW_SHARED_LINKS: ${LIBRECHAT_ALLOW_SHARED_LINKS}
      JWT_SECRET: ${LIBRECHAT_JWT_SECRET}
      JWT_REFRESH_SECRET: ${LIBRECHAT_JWT_REFRESH_SECRET}
      CREDS_KEY: ${LIBRECHAT_CREDS_KEY}
      CREDS_IV: ${LIBRECHAT_CREDS_IV}
      SESSION_EXPIRY: ${LIBRECHAT_SESSION_EXPIRY}
      REFRESH_TOKEN_EXPIRY: ${LIBRECHAT_REFRESH_TOKEN_EXPIRY}
      OPENID_CLIENT_ID: ${CASDOOR_CLIENT_ID}
      OPENID_CLIENT_SECRET: ${CASDOOR_CLIENT_SECRET}
      OPENID_ISSUER: ${CASDOOR_PUBLIC_URL}
      OPENID_SESSION_SECRET: ${LIBRECHAT_OPENID_SESSION_SECRET}
      OPENID_CALLBACK_URL: /oauth/openid/callback
      OPENID_SCOPE: ${LIBRECHAT_OPENID_SCOPE}
      OPENID_NAME_CLAIM: displayName
      OPENID_USERNAME_CLAIM: displayName
      OPENID_EMAIL_CLAIM: email
      OPENID_ALLOW_LOCAL_ACCOUNT_LINKING: "true"
      OPENID_REUSE_TOKENS: ${LIBRECHAT_OPENID_REUSE_TOKENS:-true}
      OPENID_AUTO_REDIRECT: ${LIBRECHAT_OPENID_AUTO_REDIRECT:-true}
      OPENID_MAX_LOGOUT_URL_LENGTH: ${LIBRECHAT_OPENID_MAX_LOGOUT_URL_LENGTH:-8192}
      OPENID_BUTTON_LABEL: ${LIBRECHAT_OPENID_BUTTON_LABEL}
      OPENID_ALLOW_INSECURE_HTTP: ${LIBRECHAT_OPENID_ALLOW_INSECURE_HTTP}
      OPENID_USE_PKCE: "true"
      OPENID_USE_END_SESSION_ENDPOINT: "true"
      OPENID_POST_LOGOUT_REDIRECT_URI: "${LIBRECHAT_PUBLIC_URL}/login?redirect=false"
      PLATFORM_THEME_MODE: ${PLATFORM_THEME_MODE:-dark}
      PLATFORM_THEME_LOCK: ${PLATFORM_THEME_LOCK:-true}
      PLATFORM_HIDE_THEME_SELECTOR: ${PLATFORM_HIDE_THEME_SELECTOR:-true}
      NO_INDEX: "true"
      NODE_OPTIONS: ${LIBRECHAT_NODE_OPTIONS:-}
      TRUST_PROXY: "1"
    volumes:
      - ../runtime/prod/librechat/librechat.yaml:/app/librechat.yaml:ro
      - ../runtime/prod/librechat/images:/app/client/public/images
      - ./branding/team-ai-platform-logo.svg:/app/client/public/images/team-ai-platform-logo.svg:ro
      - ./branding/team-ai-platform-mark.svg:/app/client/public/images/team-ai-platform-mark.svg:ro
      - ../runtime/prod/librechat/uploads:/app/uploads
      - ../runtime/prod/librechat/logs:/app/logs
      - ./librechat/patches:/app/librechat-patches:ro
    networks:
      - gateway

  librechat-mongodb:
    image: mongo:${MONGO_VERSION}
    container_name: ai-gateway-librechat-mongodb
    restart: always
    command: ["mongod", "--bind_ip_all"]
    volumes:
      - ../runtime/prod/librechat/mongodb:/data/db
    networks:
      - gateway

networks:
  gateway:
    driver: bridge
